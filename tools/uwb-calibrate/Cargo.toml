[package]
name = "uwb-calibrate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series"] }
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
toml_edit = "0.23"
uwb-protocol = { path = "../../crates/uwb-protocol" }

[dev-dependencies]
tempfile = "3.20"
