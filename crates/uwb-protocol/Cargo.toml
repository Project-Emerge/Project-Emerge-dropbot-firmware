[package]
name = "uwb-protocol"
version = "0.1.0"
edition = "2021"
description = "DW3000 wire protocol, TDMA timing and DS-TWR maths shared with the anchor firmware"

# Deliberately dependency-free: this crate is a boundary. `dw3000-ng`'s `Instant`/`Duration`
# and any embedded HAL types never cross into it -- `src/drivers/uwb/` in the firmware converts
# at the edge. That is what lets this crate build and test on the host with nothing but the
# standard library, and what lets it be promoted to a git dependency shared with the anchor
# firmware without dragging any of its embedded dependency tree along.
[dependencies]

[lib]
name = "uwb_protocol"
path = "src/lib.rs"
