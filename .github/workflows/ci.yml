name: CI and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ESPFLASH_SKIP_UPDATE_CHECK: "true"
  FIRMWARE_NAME: dropbot-firmware
  BUILDER: dropbot
  RUST_TARGET: riscv32imac-unknown-none-elf

jobs:
  firmware:
    name: Firmware QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Cargo/laze cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            ~/.gitcache
          key: cargo-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'laze-project.yml', 'flake.lock', 'flake.nix') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TARGET }}-

      - name: Install Rust target for ${{ env.RUST_TARGET }}
        run: |
          rustup target add "${RUST_TARGET}"
          rustup component add rust-src llvm-tools

      # `.cargo/config.toml` includes a file from the ariel-os import, which laze only
      # fetches on first use. `-G` generates the build files without compiling, so this
      # needs to run before any plain `cargo` invocation (e.g. `cargo fmt`) works at all.
      - name: Fetch project imports
        run: laze build -b "${BUILDER}" -a "${FIRMWARE_NAME}" -G

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        # Advisory only: does not fail the build. `ariel-os` is a path dependency, so
        # `--all` would also lint/format the vendored upstream source under build/imports.
        run: laze build -b "${BUILDER}" -a "${FIRMWARE_NAME}" clippy

      - name: Build release firmware
        run: laze build -b "${BUILDER}" -a "${FIRMWARE_NAME}"

      - name: Package firmware image
        run: |
          mkdir -p dist
          bin="build/bin/${BUILDER}/cargo/${RUST_TARGET}/release/${FIRMWARE_NAME}"
          cp "$bin" "dist/${FIRMWARE_NAME}.elf"
          espflash save-image --chip esp32c6 --merge "dist/${FIRMWARE_NAME}.elf" "dist/${FIRMWARE_NAME}.bin"
          sha256sum "dist/${FIRMWARE_NAME}.elf" "dist/${FIRMWARE_NAME}.bin" > dist/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FIRMWARE_NAME }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Release firmware
    needs: firmware
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Download firmware artifact
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.FIRMWARE_NAME }}-${{ github.sha }}
          path: dist

      - name: Version release assets
        if: ${{ steps.release.outputs.release_created }}
        shell: bash -e {0}
        run: |
          version="${{ steps.release.outputs.version }}"
          mv "dist/${FIRMWARE_NAME}.elf" "dist/${FIRMWARE_NAME}-${version}.elf"
          mv "dist/${FIRMWARE_NAME}.bin" "dist/${FIRMWARE_NAME}-${version}.bin"
          sha256sum "dist/${FIRMWARE_NAME}-${version}.elf" "dist/${FIRMWARE_NAME}-${version}.bin" > "dist/${FIRMWARE_NAME}-${version}-SHA256SUMS"

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" dist/* --clobber

  success:
    needs:
      - firmware
      - release
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Check workflow outcome
        shell: bash -e {0}
        run: |
          firmware_result="${{ needs.firmware.result }}"
          release_result="${{ needs.release.result }}"

          echo "firmware: ${firmware_result}"
          echo "release: ${release_result}"

          if [ "${firmware_result}" != "success" ]; then
            exit 1
          fi

          case "${release_result}" in
            success|skipped)
              ;;
            *)
              exit 1
              ;;
          esac
