name: CI and Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ESPFLASH_SKIP_UPDATE_CHECK: "true"
  FIRMWARE_NAME: project-emerge-firmware
  RUST_TARGET: riscv32imac-unknown-none-elf

jobs:
  firmware:
    name: Firmware QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop -c bash -e {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Cargo cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'flake.lock', 'flake.nix') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TARGET }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: RUSTC_WORKSPACE_WRAPPER=clippy-driver CLIPPY_ARGS=-Dwarnings cargo check --workspace --all-features --locked

      - name: Build release firmware
        run: cargo build --release --locked

      - name: Compile embedded test image
        run: cargo rustc --test hello_test --all-features --locked -- -C link-arg=-Tembedded-test.x

      - name: Package firmware image
        run: |
          mkdir -p dist
          cp "target/${RUST_TARGET}/release/${FIRMWARE_NAME}" "dist/${FIRMWARE_NAME}.elf"
          espflash save-image --chip esp32c6 --merge "dist/${FIRMWARE_NAME}.elf" "dist/${FIRMWARE_NAME}.bin"
          sha256sum "dist/${FIRMWARE_NAME}.elf" "dist/${FIRMWARE_NAME}.bin" > dist/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FIRMWARE_NAME }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Release firmware
    needs: firmware
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Download firmware artifact
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.FIRMWARE_NAME }}-${{ github.sha }}
          path: dist

      - name: Version release assets
        if: ${{ steps.release.outputs.release_created }}
        shell: bash -e {0}
        run: |
          version="${{ steps.release.outputs.version }}"
          mv "dist/${FIRMWARE_NAME}.elf" "dist/${FIRMWARE_NAME}-${version}.elf"
          mv "dist/${FIRMWARE_NAME}.bin" "dist/${FIRMWARE_NAME}-${version}.bin"
          sha256sum "dist/${FIRMWARE_NAME}-${version}.elf" "dist/${FIRMWARE_NAME}-${version}.bin" > "dist/${FIRMWARE_NAME}-${version}-SHA256SUMS"

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" dist/* --clobber

  success:
    needs:
      - firmware
      - release
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Check workflow outcome
        shell: bash -e {0}
        run: |
          firmware_result="${{ needs.firmware.result }}"
          release_result="${{ needs.release.result }}"

          echo "firmware: ${firmware_result}"
          echo "release: ${release_result}"

          if [ "${firmware_result}" != "success" ]; then
            exit 1
          fi

          case "${release_result}" in
            success|skipped)
              ;;
            *)
              exit 1
              ;;
          esac
