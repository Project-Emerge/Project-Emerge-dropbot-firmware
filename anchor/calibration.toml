# Hardware identity and antenna delay compiled into each anchor image.
#
# `expected_uid` is the 96-bit STM32 UID returned by `embassy_stm32::uid::uid()`, encoded as
# 24 hexadecimal digits in byte order. An empty value is deliberately *not* a wildcard: that
# anchor is unprovisioned and its firmware will refuse to start UWB ranging. Use
# `uwb-calibrate provision-anchor` after reading the UID from the SWD/RTT boot log.
