# Deliberately no `[workspace]` table, for the same reason the dropbot's manifest at the repo root
# does not have one: an explicit `[workspace]` makes this cargo resolve *any* dependency's
# `field.workspace = true` inheritance against *this* manifest's `[workspace.package]` instead of
# the dependency's own, which breaks `ariel-os`'s `edition.workspace = true`. The two apps are
# therefore two independent single-package builds that happen to share `../crates/*` as path
# dependencies; `laze` builds each into its own `CARGO_TARGET_DIR`.
[package]
name = "uwb-anchor-firmware"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "uwb-anchor-firmware"
path = "src/main.rs"

[features]
# Which of `uwb_protocol::ANCHOR_IDS` this build is. Exactly one must be enabled -- `src/main.rs`
# fails the build otherwise -- and there is deliberately no default: an anchor flashed with the
# wrong identity transmits in another anchor's slot, which is a collision that looks like poor RF
# rather than like a misconfiguration. The laze modules of the same names in `laze-project.yml`
# select these, with `anchor-1` (the TDMA master) as the default when none is chosen.
anchor-1 = []
anchor-2 = []
anchor-3 = []
anchor-4 = []
calibration-fixture = ["dep:uwb-fixture"]
fixture-node-1 = ["calibration-fixture"]
fixture-node-2 = ["calibration-fixture"]
fixture-node-3 = ["calibration-fixture"]

[dependencies]
ariel-os = { path = "../build/imports/ariel-os/src/ariel-os", features = [
  "no-boards",
  "external-interrupts",
  "time",
  # Lets `src/main.rs` supply `__ariel_os_rcc_config`. ariel-os's built-in `rcc_config()` has no
  # branch for this chip and would leave the part on its 4 MHz MSI default; the anchors need the
  # full 80 MHz, both for the MCU-side turnaround that dominates a ranging slot and because it is
  # what lifts PCLK2 high enough for 20 MHz SPI.
  "rcc-config-override",
] }
ariel-os-boards = { path = "../build/imports/ariel-os/src/ariel-os-boards" }
# Taken directly, exactly as the dropbot takes `esp-hal` directly, and for the same kind of
# reason. ariel-os's own SPI on STM32 is `YieldingAsync<BlockingAsync<Spi<Blocking>>>` -- no DMA --
# and its `MAX_FREQUENCY` table has no entry for this chip, so enabling the `spi` feature would not
# even compile; on top of that it exposes no way to reconfigure a live bus, which the DW3000's
# 5 -> 20 MHz clock ramp needs. ADC has no ariel-os abstraction at all. The version resolves to
# ariel-os's own fork through the `[patch.crates-io]` table its `ariel-os-cargo.toml` installs, so
# this unifies with the copy `ariel-os-stm32` uses rather than compiling a second one.
embassy-stm32 = { version = "0.4", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
# `dw3000_ng::DW3000::new` wants an `embedded_hal_async::spi::SpiDevice`; this wraps the bare
# `embassy_stm32::spi::Spi` bus together with the CS `Output`.
embedded-hal-bus = { version = "0.3", default-features = false, features = [
  "async",
] }
# Pinned exactly and with `rssi` off, for the reasons spelled out in `crates/dw3000-hal`'s
# manifest. Taken directly, not just through `dw3000-hal`, for the `Config`/`SendTime`/`Error`
# types that appear in this firmware's own signatures.
dw3000-ng = { version = "=1.0.2", default-features = false, features = ["async"] }
dw3000-hal = { path = "../crates/dw3000-hal" }
uwb-protocol = { path = "../crates/uwb-protocol" }
uwb-fixture = { path = "../crates/uwb-fixture", optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(context, values(any()))',
] }
